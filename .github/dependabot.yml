version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Cordoba"

    cooldown:
      default-days: 7

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "java"
      - "maven"

    commit-message:
      prefix: "deps"
      include: "scope"

    # 3.6.0 breaks console capture when Jazzer attaches its agent on Java 21/25.
    # Skip only the affected release; allow the next fixed version to be proposed.
    # https://github.com/apache/maven-surefire/issues/3460
    ignore:
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        versions: ["3.6.0"]
      - dependency-name: "org.apache.maven.plugins:maven-failsafe-plugin"
        versions: ["3.6.0"]

    groups:
      maven-test-plugins:
        patterns:
          - "org.apache.maven.plugins:maven-surefire-plugin"
          - "org.apache.maven.plugins:maven-failsafe-plugin"
      maven-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.apache.maven.plugins:maven-surefire-plugin"
          - "org.apache.maven.plugins:maven-failsafe-plugin"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Cordoba"

    cooldown:
      default-days: 7

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"
      include: "scope"

    groups:
      codeql-action:
        # SHA-pinned actions have no semantic version for Dependabot's
        # update-types filter, so omitting it keeps every CodeQL action grouped.
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"

  - package-ecosystem: "docker-compose"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Cordoba"

    cooldown:
      default-days: 7

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "ci"
      include: "scope"

    groups:
      ci-images:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/.github/clusterfuzzlite"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Cordoba"

    cooldown:
      default-days: 7

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "ci"
      include: "scope"
