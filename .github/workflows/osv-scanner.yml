name: OSV-Scanner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-sbom:
    name: Build CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate SBOM
        run: ./mvnw -B -ntp -nsu -Psbom,consumer-tests -DskipTests install

      - name: Upload aggregate SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            integration/target/it/selective/target/bom.json
            integration/target/it/starter/target/bom.json
          if-no-files-found: error
          retention-days: 5

  scan:
    name: Scan SBOM / osv-scan
    needs: build-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download aggregate SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyclonedx-sbom
          path: .

      - name: Scan SBOM
        shell: bash
        run: |
          docker compose --file .github/tools/compose.yml run --rm \
            osv-scanner \
            scan \
            -L /workspace/target/bom.json \
            -L /workspace/integration/target/it/selective/target/bom.json \
            -L /workspace/integration/target/it/starter/target/bom.json \
            --format sarif \
            --output-file /workspace/osv-results.sarif

      - name: Upload OSV results artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-results
          path: osv-results.sarif
          retention-days: 5
          if-no-files-found: error

      - name: Upload OSV results to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv-results.sarif
