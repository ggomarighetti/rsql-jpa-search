<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="diagrama-flujo" width="792" height="678" viewBox="-16 -16 792 678" role="img" aria-labelledby="diagrama-flujo-title diagrama-flujo-description">
<title id="diagrama-flujo-title">Where rsql-jpa-search fits</title>
<desc id="diagrama-flujo-description">A ticket request passes through the controller and service. SearchCompiler uses SearchDefinition and returns CompiledSearch. The application passes its Specification and Pageable to TicketRepository, which extends JpaSpecificationExecutor and returns a Page of tickets.</desc>
<rect x="-16" y="-16" width="792" height="678" fill="#ffffff"/>
<style>#diagrama-flujo .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#141414;text-anchor:middle;dominant-baseline:central}#diagrama-flujo .g{font-family:Inter,system-ui,sans-serif;font-size:11px;fill:#6b6b6b;letter-spacing:.04em}#diagrama-flujo .e{fill:none;stroke:#a3a3a3;stroke-width:1;marker-end:url(#diagrama-flujo-flecha)}</style>
